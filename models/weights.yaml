# Projection model coefficients.
#
# Everything tunable lives here so you can adjust the model's behaviour without
# touching code. After editing, re-run the backtest to check you actually
# improved things:  python -m tests.backtest
#
# ---------------------------------------------------------------------------

# How much recent history to measure "current role" over. Two weeks is roughly
# 6-8 games: long enough to be stable, short enough to catch a promotion.
window_days: 14

# --- Rate estimation -------------------------------------------------------
# A player's scoring rate is a weighted blend of three estimates. The weights
# are in *hours of ice time*, which makes them self-balancing: a player with
# only 40 minutes in the window automatically leans on his season numbers and
# the positional prior, while a full-time player leans on his own results.
#
# At the defaults below a typical regular's rate is roughly:
#     26% recent form | 37% season | 37% positional prior
#
# That looks under-weighted on recent form, and it is deliberate. Measured over
# five backtested weeks (2026-10-12 to 2026-11-09), pushing recency harder makes
# the projections monotonically WORSE:
#
#     recent weight    top-20 actual pts    rank corr
#     26% (default)          33.56            0.581
#     ~45%                   33.17            0.575
#     ~65%                   32.07            0.558
#     ~80% (10d window)      31.34            0.546
#     naive pts/gm x games   32.00            0.556
#
# The heaviest-recency setting is worse than doing no modelling at all.
#
# A direct test of the obvious objection -- "surely it over-rates cold players"
# -- says the opposite. Bucketing players by trailing 10-day scoring and
# comparing projection against what they actually went on to score:
#
#     COLD (bottom 25%)   beat projection by +3.34
#     MID                 beat projection by +3.81
#     HOT  (top 25%)      beat projection by +2.26
#
# Cold players outperform their projections by MORE than hot ones. This is mean
# reversion: a cold player whose ice time and shot volume are unchanged is
# usually just unlucky, and buying him is closer to a bargain than a trap.
#
# The real signal inside "he's been hot" is usually a role change -- more
# power-play time, a promotion up the lines -- and the model captures that
# directly and far more precisely through pp_share and line_rank than raw
# points ever could.
#
# If you want to override this anyway, raise recent_multiplier and lower
# season_multiplier and prior_hours together, then re-run `python -m
# tests.backtest` and check you have not made it worse.
rates:
  # Weight given to the trailing window, as a multiple of TOI actually observed.
  recent_multiplier: 1.0

  # Season-to-date is discounted, because role changes make old games less
  # relevant to what happens this week.
  season_multiplier: 0.45

  # Strength of the positional prior, in hours. Higher = more regression to the
  # mean for small samples. ~3 hours is about 10 games of a top-six forward.
  # This is the main guard against a fourth-liner who scored twice on a hot
  # weekend rocketing to the top of your rankings.
  prior_hours: 3.0

# --- Expected ice time -----------------------------------------------------
# What we think he'll play in the *next* game, which is not the same as what
# he has averaged.
ice_time:
  # Blend between measured trailing TOI and the typical TOI for his listed line.
  # 0 = trust only measured, 1 = trust only the line listing.
  line_baseline_weight: 0.30

  # When Daily Faceoff shows a role change the measured average is stale by
  # construction, so we lean much harder on the role baseline.
  line_baseline_weight_on_change: 0.70

  # Typical even-strength seconds per game by forward line / defence pair.
  forward_es_baseline:   {1: 930, 2: 840, 3: 720, 4: 570}
  defence_es_baseline:   {1: 1230, 2: 1080, 3: 870}

  # Typical share of team power-play time by unit. First units take most of it.
  pp_share_baseline:     {1: 0.68, 2: 0.32}

  # Sanity clamps (seconds per game).
  max_es_toi: 1680     # 28:00
  max_pp_toi: 360      # 6:00

# --- Availability ----------------------------------------------------------
# Probability the player actually appears in a given game.
availability:
  healthy: 1.00
  game_time_decision: 0.50
  day_to_day: 0.70
  out: 0.0

  # If Daily Faceoff doesn't list him in a line at all, he is probably a
  # scratch or in the press box, even when no injury is flagged.
  unlisted: 0.45

  # Daily Faceoff listings older than this are treated with suspicion.
  stale_listing_hours: 48
  stale_listing_penalty: 0.95

# --- Confidence ------------------------------------------------------------
# Not used to rank, but shown in the UI so you know how much to trust a number.
confidence:
  full_sample_games: 8     # games in the window for full confidence
  fresh_listing_hours: 24

# --- Goalies ---------------------------------------------------------------
goalies:
  # Probability the listed starter actually starts, and the backup's share.
  starter_start_prob: 0.72
  backup_start_prob: 0.28

  # A starter is much less likely to go on the second night of a back-to-back.
  back_to_back_starter_prob: 0.35

  # League-average shots faced per start, used when a goalie has little data.
  league_shots_per_start: 29.0

  # Regression strength for save percentage, in shots faced. Goalie save
  # percentage is notoriously noisy over small samples -- 400 shots is roughly
  # 14 starts and still not really enough.
  save_pct_prior_shots: 400.0
  league_save_pct: 0.903

  # Chance of a win, before adjusting for opponent.
  base_win_prob: 0.50
  # How much team and opponent strength move the win probability.
  win_prob_strength_weight: 0.18
  shutout_base_prob: 0.075

# --- Hot streaks -----------------------------------------------------------
# Extra expected points per game for a player on a run, shaped from
# tests/hot_hand_study.py. That study compared the 10 games before a streak
# against the 10 after (streak excluded from both, control group for drift):
#
#     3 games at  6+ FP   N=119   +0.25 over control
#     3 games at  8+ FP   N= 44   +0.38
#     3 games at 10+ FP   N= 20   +0.99
#     4 games at  8+ FP   N= 15   +1.87
#
# Real, and it scales with intensity. But whether it belongs in the PROJECTION
# is a separate question from whether it is real, and the backtest answered it:
#
#     scale    top-20    rank corr
#      0.00     33.56      0.581     <- best on both
#      0.25     33.17      0.578
#      0.50     33.44      0.574
#      1.00     33.30      0.568
#
# Folding streaks into the projection makes it no better and ranks slightly
# worse. That fits the study's own finding: the dominant effect was
# IDENTIFICATION, not prediction -- hot players were already good, and the
# model already knows they are good from their season rates and their role.
# The extra +0.38 is too small to survive the noise it brings with it.
#
# So the streak signal lives in the "Running hot" list, where it does its real
# job of pointing you at players worth a look, and stays out of the
# projection, which is better off without it. Raising `scale` turns it on;
# re-run `python -m tests.backtest` if you do.
streaks:
  scale: 0.0
  max_bonus: 2.5               # ceiling, points per game

# --- Combined "best fits" ranking ------------------------------------------
# The headline list blends three views that answer different questions and
# routinely disagree:
#
#   projection  how good is he, in the abstract
#   fit         how much he improves the lineups YOUR roster can field
#   heat        whether something is happening with him right now
#
# Fit leads because it is the only one measured against your actual team: a
# player who cannot crack your lineup is worth nothing however well he
# projects. Heat trails because the hot-streak study found it real but modest,
# and chiefly useful for spotting players rather than preferring them.
#
# Unlike the rate weights, these are a judgement call and not a backtested
# result. There is no clean way to backtest them without a history of what the
# roster looked like each week.
overall:
  projection: 0.35
  fit: 0.45
  heat: 0.20
